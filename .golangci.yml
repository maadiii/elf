version: "2"

linters:
  default: none
  enable:
  - forbidigo
  - gocritic
  - bodyclose
  - exhaustive
  - goconst
  - gocognit
  - gochecknoinits
  - nlreturn
  - lll
  - mnd
  - forcetypeassert
  - tagliatelle
  - dupl
  - nonamedreturns
  - paralleltest
  - cyclop
  - nakedret
  - recvcheck
  - staticcheck
  - errcheck
  - ineffassign
  - gocyclo

formatters:
  enable:
  - goimports

run:
  timeout: 5m
  issues-exit-code: 1
